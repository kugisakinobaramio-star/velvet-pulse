<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d5c4"/>
      <stop offset="100%" stop-color="#c9a88a"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1210" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d0a09" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="#0f0c0b"/>
  <rect width="400" height="600" fill="url(#shadow)"/>

  <!-- Soft light from left -->
  <ellipse cx="80" cy="200" rx="120" ry="180" fill="#3a2a22" opacity="0.4" filter="url(#soft)"/>

  <!-- Nude female figure - standing, holding key -->
  <!-- Head -->
  <ellipse cx="200" cy="95" rx="32" ry="38" fill="url(#skin)"/>
  <!-- Neck -->
  <rect x="190" y="125" width="20" height="25" fill="url(#skin)"/>
  <!-- Shoulders & torso -->
  <path d="M145 155 Q200 140 255 155 L250 280 Q200 300 150 280 Z" fill="url(#skin)"/>
  <!-- Breasts suggestion -->
  <ellipse cx="175" cy="190" rx="22" ry="18" fill="#d4b89a" opacity="0.7"/>
  <ellipse cx="225" cy="190" rx="22" ry="18" fill="#d4b89a" opacity="0.7"/>
  <!-- Nipples subtle -->
  <circle cx="175" cy="192" r="3.5" fill="#b89070" opacity="0.8"/>
  <circle cx="225" cy="192" r="3.5" fill="#b89070" opacity="0.8"/>

  <!-- Arms -->
  <path d="M145 160 Q110 200 105 260" stroke="url(#skin)" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M255 160 Q290 200 295 260" stroke="url(#skin)" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Hand holding key (right) -->
  <ellipse cx="295" cy="270" rx="12" ry="16" fill="url(#skin)"/>
  <!-- Key -->
  <g transform="translate(300,255) rotate(25)">
    <rect x="0" y="0" width="6" height="28" rx="1" fill="#c9a227"/>
    <circle cx="3" cy="-4" r="7" fill="none" stroke="#c9a227" stroke-width="3"/>
    <rect x="-2" y="22" width="10" height="4" fill="#c9a227"/>
    <rect x="-2" y="28" width="6" height="3" fill="#c9a227"/>
  </g>

  <!-- Hips & lower body -->
  <path d="M150 275 Q200 290 250 275 L245 420 Q200 450 155 420 Z" fill="url(#skin)"/>
  <!-- Pubic suggestion -->
  <ellipse cx="200" cy="355" rx="18" ry="12" fill="#b89070" opacity="0.4"/>

  <!-- Legs -->
  <path d="M165 415 Q155 500 150 560" stroke="url(#skin)" stroke-width="28" fill="none" stroke-linecap="round"/>
  <path d="M235 415 Q245 500 250 560" stroke="url(#skin)" stroke-width="28" fill="none" stroke-linecap="round"/>

  <!-- Soft shadow under figure -->
  <ellipse cx="200" cy="575" rx="70" ry="12" fill="#000" opacity="0.5"/>

  <!-- Title hint -->
  <text x="200" y="40" text-anchor="middle" fill="#8a7a6a" font-family="Georgia, serif" font-size="14" letter-spacing="3">THE KEY</text>
</svg>