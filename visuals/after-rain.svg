<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="skin3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d0b8"/>
      <stop offset="100%" stop-color="#c9a88a"/>
    </linearGradient>
    <linearGradient id="skin4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b89a"/>
      <stop offset="100%" stop-color="#b89070"/>
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2530"/>
      <stop offset="100%" stop-color="#0a1015"/>
    </linearGradient>
  </defs>

  <!-- Dark room -->
  <rect width="500" height="400" fill="#0e0b0a"/>

  <!-- Window with rain suggestion -->
  <rect x="320" y="40" width="140" height="180" fill="url(#window)" rx="4"/>
  <line x1="340" y1="50" x2="330" y2="210" stroke="#3a4a55" stroke-width="1" opacity="0.6"/>
  <line x1="360" y1="55" x2="355" y2="205" stroke="#3a4a55" stroke-width="1" opacity="0.5"/>
  <line x1="390" y1="45" x2="380" y2="215" stroke="#3a4a55" stroke-width="1" opacity="0.7"/>
  <line x1="420" y1="60" x2="415" y2="200" stroke="#3a4a55" stroke-width="1" opacity="0.4"/>
  <line x1="440" y1="50" x2="435" y2="210" stroke="#3a4a55" stroke-width="1" opacity="0.55"/>

  <!-- Couch suggestion -->
  <rect x="40" y="280" width="280" height="80" rx="8" fill="#1a1512"/>
  <rect x="40" y="260" width="280" height="30" rx="6" fill="#221c18"/>

  <!-- Couple: woman straddling (simplified elegant forms) -->
  <!-- Male torso base -->
  <ellipse cx="160" cy="250" rx="55" ry="40" fill="url(#skin4)"/>
  <path d="M110 250 Q160 230 210 250 L200 320 Q160 340 120 320 Z" fill="url(#skin4)"/>

  <!-- Female figure on top -->
  <ellipse cx="160" cy="160" rx="28" ry="32" fill="url(#skin3)"/> <!-- head -->
  <path d="M135 185 Q160 175 185 185 L190 250 Q160 270 130 250 Z" fill="url(#skin3)"/> <!-- torso -->
  
  <!-- Breasts -->
  <ellipse cx="148" cy="210" rx="16" ry="14" fill="#e0c4a8"/>
  <ellipse cx="172" cy="210" rx="16" ry="14" fill="#e0c4a8"/>
  <circle cx="148" cy="212" r="3" fill="#c9a07a" opacity="0.8"/>
  <circle cx="172" cy="212" r="3" fill="#c9a07a" opacity="0.8"/>

  <!-- Her arms around him -->
  <path d="M130 195 Q100 220 110 260" stroke="url(#skin3)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M190 195 Q220 220 210 260" stroke="url(#skin3)" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Her hips / connection -->
  <ellipse cx="160" cy="280" rx="40" ry="25" fill="url(#skin3)" opacity="0.95"/>

  <!-- Soft light on bodies -->
  <ellipse cx="160" cy="200" rx="80" ry="100" fill="#3a2a20" opacity="0.15"/>

  <text x="250" y="30" text-anchor="middle" fill="#6a5a4a" font-family="Georgia, serif" font-size="12" letter-spacing="2">AFTER THE RAIN</text>
</svg>